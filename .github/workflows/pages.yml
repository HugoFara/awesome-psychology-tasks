name: Build and deploy the site

# The site is the second renderer of data/ (the README is the first). It is
# generated on every push to main and published to GitHub Pages; site/out is never
# committed. Pull requests build only, so a broken build is caught before merge.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/build_readme.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "data/**"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/build_readme.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Check the README is in sync with data/
        run: python scripts/build_readme.py --check
      - name: Build the site
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
